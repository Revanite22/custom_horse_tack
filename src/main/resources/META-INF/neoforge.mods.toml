license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Voxxi (art); Sekelsta (RHG and integration assistance); TeaJ4y (horse stat conversion math)"
description='''${mod_description}'''

[[mixins]]
config="truly_custom_horse_tack.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="horse_colors"
type="required"
versionRange="[${rhg_version}]"
ordering="AFTER"
side="BOTH"
