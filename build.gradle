plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${minecraft_version}-${mod_version}"
group = "${mod_group_id}${mod_id}"
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach {
            gameDirectory = file("run/${name}")
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
apply from: 'gradle/rhg-dependency.gradle'

// No legacy fg.deobf/reobfJar or MixinGradle: 26.1 uses unobfuscated names.
// NeoForge supplies Mixin; the config is registered in neoforge.mods.toml.
tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range, rhg_version: rhg_version,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    from('LICENSE.txt') { into 'META-INF' }
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Resolves external compile dependencies without invoking javac or Minecraft setup.
// Local RHG availability is checked separately by prepareRhgDependency.
tasks.register('resolveCompileDependencies') {
    group = 'verification'
    description = 'Resolve external compile dependencies without compiling legacy Java.'
    doLast {
        def artifacts = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts
        logger.lifecycle("Resolved ${artifacts.size()} external compile artifacts; RHG is validated separately.")
    }
}
